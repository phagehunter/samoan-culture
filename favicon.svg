<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <!-- woven fine-mat ('ie toga) lattice -->
  <g stroke="#e0c088" stroke-width="2.4" stroke-linecap="round" opacity="0.95">
    <line x1="14" y1="20" x2="50" y2="20"/>
    <line x1="14" y1="32" x2="50" y2="32"/>
    <line x1="14" y1="44" x2="50" y2="44"/>
  </g>
  <g stroke="#ea8a4c" stroke-width="2.4" stroke-linecap="round" opacity="0.95">
    <line x1="20" y1="14" x2="20" y2="50"/>
    <line x1="32" y1="14" x2="32" y2="50"/>
    <line x1="44" y1="14" x2="44" y2="50"/>
  </g>
  <rect x="12" y="12" width="40" height="40" rx="6" fill="none" stroke="#b3854a" stroke-width="1.6"/>
</svg>
